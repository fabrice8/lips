<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Opt-in Stylis</title>
<style>
  body { font: 14px/1.5 ui-monospace, Menlo, monospace; margin: 2rem; max-width: 60rem }
  .row { padding: 2px 0 } .ok::before { content: '✓ '; color: #1a7f37 }
  .bad::before { content: '✗ '; color: #cf222e } .bad { color: #cf222e; font-weight: 600 }
  #summary { margin-top: 1.2rem; padding: .6rem .8rem; border-radius: 4px; font-weight: 600 }
  .pass { background: #e6f4ea; color: #1a7f37 } .fail { background: #ffebe9; color: #cf222e }
  pre { background: #f6f8fa; padding: .6rem; overflow-x: auto; font-size: 12px }
</style>
</head>
<body>
<h1>Opt-in Stylis</h1>
<div id="stage"></div>
<h3>checks</h3><div id="out"></div>
<div id="summary"></div>
<h3>emitted sheet</h3><pre id="sheet"></pre>

<script type="module">
// The opt-in: the preprocessor is handed over as a VALUE. The two
// entries are separate bundles, so a side-effect import could not
// reach the main bundle's module state.
import { stylisPreprocessor as stylePreprocessor } from '../dist/stylis.min.js'
import Lips from '../dist/lips.min.js'

const out = document.getElementById('out')
let pass = 0, fail = 0
const check = ( label, got, want ) => {
  const ok = got === want
  ok ? pass++ : fail++
  const d = document.createElement('div')
  d.className = 'row ' + ( ok ? 'ok' : 'bad' )
  d.textContent = ok ? label : `${label} — got ${JSON.stringify(got)}, want ${JSON.stringify(want)}`
  out.appendChild( d )
}
const tick = ms => new Promise( r => setTimeout( r, ms ) )

const lips = new Lips({ stylePreprocessor })
lips.root({
  state: { w: 60 },
  stylesheet: `
    .box { width: {state.w}px; height: 20px; background: #3b82f6 }
    @keyframes pulse { 0% { opacity: 1 } 100% { opacity: .25 } }
  `,
  default: `<div><div class="box" id="b"></div></div>`
}, '#stage')

await tick( 120 )
const el = document.getElementById('b')
const sheet = document.head.querySelector('style[rel]')?.textContent || ''
document.getElementById('sheet').textContent = sheet

check('preprocessor flattened the wrap', sheet.includes('[rel="__ROOT__"] .box'), true)
check('…so the sheet is no longer nested', sheet.includes('[rel="__ROOT__"] {'), false)
check('@keyframes survives flattening', sheet.includes('@keyframes pulse'), true)
check('styles still apply', getComputedStyle( el ).width, '60px')

lips.__root.state.w = 140
await tick( 80 )
check('reactivity unaffected by the preprocessor', getComputedStyle( el ).width, '140px')

const s = document.getElementById('summary')
s.className = fail ? 'fail' : 'pass'
s.textContent = `${pass}/${pass+fail} checks passed`
</script>
</body>
</html>
