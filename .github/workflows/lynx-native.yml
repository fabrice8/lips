name: Lynx native

# RFC-006 test tier B: the Lynx demo in the REAL Lynx engine (libLynx_clay),
# headless, through demos/lynx/native/run.sh, on Linux and on macOS (Apple
# Silicon, what a maintainer's machine runs). It is separate from CI
# because it builds the runner crates in Rust and downloads the engine, so
# it runs only when code the demo exercises changes.
on:
  push:
    branches: [ master ]
    paths: [ 'src/**', 'demos/lynx/**', '.github/workflows/lynx-native.yml' ]
  pull_request:
    paths: [ 'src/**', 'demos/lynx/**', '.github/workflows/lynx-native.yml' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tier-b:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
      # No debug info: a quarter of the build output, and nothing reads it
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demos/lynx/package-lock.json

      # The one shared library the engine needs beyond glibc
      - name: Engine runtime dependency
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libepoxy0

      # The engine, its core script and the runner sources. run.sh checks
      # the engine's SHA-256 again on every run, cached or not.
      - uses: actions/cache@v4
        with:
          path: demos/lynx/native/.cache
          key: lynx-native-sdk-${{ hashFiles('demos/lynx/native/run.sh') }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            demos/lynx/native/target
          key: lynx-native-cargo-${{ hashFiles('demos/lynx/native/Cargo.lock', 'demos/lynx/native/run.sh') }}

      - name: Install demo dependencies
        working-directory: demos/lynx
        run: npm ci --no-audit --no-fund

      - name: The demo in the real Lynx engine
        run: demos/lynx/native/run.sh

      - name: Keep the frame and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lynx-native
          path: |
            demos/lynx/dist/native.bmp
            demos/lynx/native/.cache/run.log
            demos/lynx/native/.cache/build.log
          if-no-files-found: ignore

  # The same run on Apple Silicon: the macOS runtime, ad-hoc signed by run.sh
  tier-b-macos:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demos/lynx/package-lock.json

      - uses: actions/cache@v4
        with:
          path: demos/lynx/native/.cache
          key: lynx-native-macos-sdk-${{ hashFiles('demos/lynx/native/run.sh') }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            demos/lynx/native/target
          key: lynx-native-macos-cargo-${{ hashFiles('demos/lynx/native/Cargo.lock', 'demos/lynx/native/run.sh') }}

      - name: Install demo dependencies
        working-directory: demos/lynx
        run: npm ci --no-audit --no-fund

      - name: The demo in the real Lynx engine
        run: demos/lynx/native/run.sh

      - name: Keep the frame and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lynx-native-macos
          path: |
            demos/lynx/dist/native.bmp
            demos/lynx/native/.cache/run.log
            demos/lynx/native/.cache/build.log
          if-no-files-found: ignore
